name: Build Android APK

on:
  push:
    branches:
      - main
      - codex/noor-apk-no-lovable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Patch Android notification seek controls
        run: node scripts/patch-playlist-notification.mjs

      - name: Build web app
        run: npm run build

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android launcher icon
        run: npx --yes @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Kotlin version for media player
        run: sed -i "/cordovaAndroidVersion =/a\\    kotlin_version = '2.4.20'" android/variables.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
